<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ankur">
  <!-- Board green mark · Ankur = sprout — learning that grows -->
  <rect width="32" height="32" rx="8" fill="#0c2920"/>
  <!-- soil mound -->
  <ellipse cx="16" cy="25.5" rx="7.5" ry="2.2" fill="#143d30"/>
  <!-- stem -->
  <path
    d="M16 24.5 C16 20 16.2 15.5 16 12"
    fill="none"
    stroke="#f7f4ec"
    stroke-width="2"
    stroke-linecap="round"
  />
  <!-- left leaf -->
  <path
    d="M15.6 16.5 C12 14.2 9.2 11.8 9.8 9.6 C12.6 9.2 15.2 11.5 16 14.2 Z"
    fill="#3dd68c"
  />
  <!-- right leaf -->
  <path
    d="M16.4 14.8 C19.5 12.2 22.8 10.4 23.2 12.6 C21.2 15.4 18.2 16.8 16.2 17.6 Z"
    fill="#0f8f5a"
  />
  <!-- bud tip -->
  <circle cx="16" cy="10.2" r="1.6" fill="#3dd68c"/>
</svg>
